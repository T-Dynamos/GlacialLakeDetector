[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GlacialLakeDetector"
version = "3.1.0"
authors = [
  { name = "Team Prob-ution (Leh, Ladakh)", email = "anshdadwal298@gmail.com" },
]
description = "Automated Glacial Lake Detection and GLOF Susceptibility Assessment using SAR and DEM Topography"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24.0",
    "rasterio>=1.3.0",
    "scipy>=1.10.0",
    "shapely>=2.0.0",
    "matplotlib>=3.7.0",
    "rich>=13.0.0",
    "kivy>=2.3.0",
    "kivymd>=2.0.0",
    "kivy-garden.matplotlib>=0.1.0",
    "kivy-garden.mapview>=1.0.6",
    "asynckivy>=0.6.4",
    "vispy>=0.14.0",
    "PyQt6>=6.5.0",
]

[project.scripts]
glacial-lake-detector = "glof_watch.cli:main"
glaciallakedetector = "glof_watch.cli:main"
glacial-lake-detector-gui = "glof_watch.ui.app:main"
glof-watch = "glof_watch.cli:main"
glof-watch-gui = "glof_watch.ui.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

